services:
  - type: web
    name: capstone-fuas
    runtime: python

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"

      - key: ALLOWED_ORIGINS
        value: "https://capstone-fuas.onrender.com"

      - key: RATE_LIMIT_PREDICT
        value: "30"

      - key: RATE_LIMIT_EXPLAIN
        value: "20"

    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn api:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
