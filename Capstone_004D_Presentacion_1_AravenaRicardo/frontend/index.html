<!doctype html>

  <body>
    
    
    
    
    <div id="root"></div>

    <div id="debug-error"
         style="
           display:none;
           white-space:pre-wrap;
           padding:20px;
           margin:20px;
           background:#fee2e2;
           color:#991b1b;
           font-family:monospace;
         ">
    </div>

    <script>
      window.addEventListener("error", function (event) {
        const box = document.getElementById("debug-error");
        box.style.display = "block";
        box.textContent =
          "ERROR JS:\n" +
          event.message +
          "\n\nArchivo: " +
          event.filename +
          "\nLínea: " +
          event.lineno +
          ":" +
          event.colno;
      });

      window.addEventListener("unhandledrejection", function (event) {
        const box = document.getElementById("debug-error");
        box.style.display = "block";
        box.textContent =
          "PROMISE ERROR:\n" +
          String(event.reason);
      });
    </script>
