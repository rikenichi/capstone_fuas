name: CI - Tests Capstone FUAS

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Ejecutar pruebas automatizadas
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Capstone_004D_Presentacion_1_AravenaRicardo

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Capstone_004D_Presentacion_1_AravenaRicardo/requirements-prod.txt

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements-prod.txt
          pip install pytest httpx

      - name: Ejecutar suite de pruebas
        run: pytest -q
