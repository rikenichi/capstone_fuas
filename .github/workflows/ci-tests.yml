name: CI - Tests Capstone FUAS

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Ejecutar pruebas automatizadas
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Capstone_004D_Presentacion_1_AravenaRicardo

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Capstone_004D_Presentacion_1_AravenaRicardo/requirements-prod.txt

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements-prod.txt
          pip install pytest httpx pip-audit

      - name: Escanear vulnerabilidades de dependencias
        run: pip-audit -r requirements-prod.txt

      - name: Ejecutar suite de pruebas
        run: pytest -q

      - name: Validar artefacto de monitoreo
        run: |
          python src/generate_monitoring_artifact.py \
            --drift artifacts/reports/drift/data_drift_2024_vs_2025.json \
            --performance artifacts/reports/performance_monitoring/performance_2024_vs_2025.json \
            --output artifacts/monitoring/model_monitoring_ci.json \
            --model-version rf-2024-v1.0.0

      - name: Verificar consistencia del monitoreo
        run: |
          python src/check_monitoring_consistency.py \
            --expected artifacts/monitoring/model_monitoring.json \
            --generated artifacts/monitoring/model_monitoring_ci.json
